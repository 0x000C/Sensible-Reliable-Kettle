name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/requirements-interview-JqSpM

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd flip7-analyzer
          npm ci

      - name: Build
        run: |
          cd flip7-analyzer
          npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./flip7-analyzer/dist
          publish_branch: gh-pages
